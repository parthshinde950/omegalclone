
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Playfair Display', serif;

    background:
      radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 35%),
      radial-gradient(circle at 80% 80%, #f4b7c9 0%, transparent 40%),
      linear-gradient(135deg, #fff1f4, #fbd5df, #fce9ed);
}

/* Floating background hearts */

.heart {
    position: absolute;
    color: rgba(202, 76, 119, 0.15);
    animation: float 7s infinite ease-in-out;
    pointer-events: none;
}

.heart:nth-child(1) {
    top: 12%;
    left: 12%;
    font-size: 45px;
}

.heart:nth-child(2) {
    top: 72%;
    right: 12%;
    font-size: 65px;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    bottom: 12%;
    left: 20%;
    font-size: 30px;
    animation-delay: 3s;
}

.heart:nth-child(4) {
    top: 20%;
    right: 18%;
    font-size: 35px;
    animation-delay: 1s;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-22px) rotate(12deg);
    }
}

/* Main glass card */

.container {
    position: relative;
    z-index: 2;
    width: min(88%, 390px);
    padding: 65px 30px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    align-items: center;

    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 35px;

    box-shadow:
      0 25px 70px rgba(160, 58, 91, 0.16),
      inset 0 1px 1px rgba(255,255,255,0.9);
}

/* Buttons */

button {
    width: 100%;
    padding: 20px 15px;
    border: none;
    border-radius: 50px;

    font-family: 'Playfair Display', serif;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: 1px;

    cursor: pointer;
    transition: all 0.3s ease;
}

#yesBtn {
    color: white;

    background: linear-gradient(
      135deg,
      #e85d87,
      #c92f65
    );

    box-shadow:
      0 10px 25px rgba(201, 47, 101, 0.3);
}

#yesBtn:hover {
    transform: translateY(-5px) scale(1.03);

    box-shadow:
      0 15px 30px rgba(201, 47, 101, 0.4);
}

#noBtn {
    color: #b83f68;

    background: rgba(255,255,255,0.85);

    border: 1px solid #e8a1b7;

    box-shadow:
      0 8px 20px rgba(160,58,91,0.08);
}

#noBtn:hover {
    transform: translateY(-5px);
    background: white;
}

button:active {
    transform: scale(0.96);
}

/* Mobile adjustments */

@media(max-width: 480px) {
    .container {
        padding: 55px 25px;
    }

    button {
        font-size: 23px;
        padding: 19px;
    }
}

</style>
</head>

<body>

<div class="heart">♥</div>
<div class="heart">♡</div>
<div class="heart">♥</div>
<div class="heart">♡</div>

<div class="container">

    <button id="yesBtn">YES </button>

    <button id="noBtn">NO</button>

</div>

<script>
const phoneNumber = "919172368960"; // Replace with your number

function sendToWhatsApp(answer) {

  const message = answer === "YES"
    ? "YES PARTH❤️"
    : "NO PARTH";

  const whatsappURL =
    `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

  window.open(whatsappURL, "_blank");

}

document.getElementById("yesBtn").onclick = function() {
  sendToWhatsApp("YES");
};

document.getElementById("noBtn").onclick = function() {
  sendToWhatsApp("NO");
};
</script>

</body>
</html>
